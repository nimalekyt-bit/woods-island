<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <title>Woods Island · Phone</title>
    <link rel="stylesheet" href="/phone/style.css" />
    <script src="/phone/app.js" defer></script>
  </head>
  <body>
    <main>
      <header class="hero">
        <div class="brand">
          <div class="pill-mark" aria-hidden="true">
            <span class="pill-wave"><i></i><i></i><i></i></span>
          </div>
          <div class="brand-text">
            <span class="eyebrow">WOODS ISLAND · WI-FI</span>
            <h1>Woods Island</h1>
            <p data-i18n="tagline"></p>
          </div>
        </div>
        <button id="disconnect" class="ghost-btn" disabled data-i18n="disconnect"></button>
      </header>

      <section class="connection" data-state="pending" aria-live="polite">
        <span id="connection-dot" aria-hidden="true"></span>
        <div class="connection-copy">
          <strong id="connection-title"></strong>
          <p id="connection-detail"></p>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 data-i18n="toComputer"></h2>
          <span class="chip" data-i18n="localBadge"></span>
        </div>
        <p data-i18n="localHint"></p>
        <div class="actions">
          <button id="pick-photos" class="action-tile primary" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="3" />
              <circle cx="9" cy="10.5" r="1.7" />
              <path d="M21 15.5l-4.5-4.5-6 6" />
            </svg>
            <span data-i18n="photos"></span>
          </button>
          <button id="pick-files" class="action-tile" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
              <path d="M14 3v5h5" />
              <path d="M12 12v5" />
              <path d="M9.5 14.5L12 12l2.5 2.5" />
            </svg>
            <span data-i18n="files"></span>
          </button>
        </div>
        <input id="photos" type="file" accept="image/*,video/*" multiple hidden />
        <input id="files" type="file" multiple hidden />
        <div id="upload-progress" class="progress-box" hidden>
          <div class="progress-top">
            <span id="progress-label"></span>
            <button id="cancel-upload" class="cancel-btn" data-i18n="cancel"></button>
          </div>
          <progress id="progress" max="100" value="0"></progress>
        </div>
        <div id="sent-list" class="sent-list" hidden></div>
        <p class="limit" data-i18n="fileLimit"></p>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 data-i18n="textTitle"></h2>
        </div>
        <label class="sr-only" for="text" data-i18n="textTitle"></label>
        <textarea id="text" rows="3" maxlength="32000" disabled></textarea>
        <button id="send-text" class="send-btn" disabled data-i18n="sendText"></button>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 data-i18n="fromComputer"></h2>
        </div>
        <p id="files-empty" class="empty-copy" data-i18n="empty"></p>
        <div id="offered"></div>
      </section>

      <p id="message" role="status"></p>

      <footer>
        <p data-i18n="footer"></p>
      </footer>
    </main>
  </body>
</html>
