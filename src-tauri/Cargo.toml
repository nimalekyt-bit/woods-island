[package]
name = "woods-island"
version = "1.0.0"
description = "Dynamic Island HUD for Windows (Woods Personal Corp)"
authors = ["Nikita Kuznetsov (Woods)"]
edition = "2021"

[lib]
name = "woods_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.1", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-drag = "2.1"
clipboard-win = "5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
arboard = "3.4"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Services",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Globalization",
    "Win32_System_WinRT",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Rras",
    "Win32_Networking_WinSock",
    "Win32_Devices_Bluetooth",
    "Win32_Security_Cryptography",
    "Globalization",
    "Media_Ocr",
    "Graphics_Imaging",
    "Devices_Radios",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "UI_Notifications",
    "UI_Notifications_Management",
    "ApplicationModel",
    "Media_Control",
    "Storage",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections"
] }
anyhow = "1.0"
chrono = "0.4"
base64 = "0.22"
urlencoding = "2.1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
rustfft = "6.2"
tokio-tungstenite = { version = "0.26", features = ["connect"] }
futures-util = "0.3"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.10"
toml_edit = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
pdf-extract = "0.10"

[profile.release]
opt-level = 2
codegen-units = 16
lto = false
incremental = true
