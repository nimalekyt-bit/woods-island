name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify owner-only history
        env:
          WOODS_OWNER_HISTORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-commit-owners.mjs $env:WOODS_OWNER_HISTORY_REF
      - name: Verify runtime and hooks
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:hooks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:runtime-state
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:ipc
      - name: Install verified Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - name: Rust regression tests
        run: cargo +1.98.1 test --release --locked -j 3 --manifest-path src-tauri/Cargo.toml
      - name: Build Windows executable
        run: cargo +1.98.1 build --release --locked -j 3 --manifest-path src-tauri/Cargo.toml
      - name: Upload private executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: woods-island-windows-exe
          path: src-tauri/target/release/woods-island.exe
          if-no-files-found: error
          retention-days: 14
