name: Publish exact accepted Woods Island 1.3.0
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: woods-island-stable-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ACCEPTANCE_RUN_ID: '44977282639'
      SOURCE_REVISION: '3daea921bd9ff0eeb4f49361b2e2650bc86c16fb'
    steps:
      - name: Checkout publication worker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: worker
          persist-credentials: false
      - name: Checkout exact accepted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '3daea921bd9ff0eeb4f49361b2e2650bc86c16fb'
          path: accepted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Download accepted installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: woods-island-installer
          path: dist-installer
          github-token: ${{ github.token }}
          run-id: '44977282639'
      - name: Download raw accepted executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: woods-island-windows-exe
          path: application
          github-token: ${{ github.token }}
          run-id: '44977282639'
      - name: Repeat exact-source gates, verify payloads and publish stable
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node worker/scripts/publish-accepted-release.mjs
      - name: Save publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woods-island-1.3.0-publication-receipt
          path: release-receipt.json
          if-no-files-found: error
