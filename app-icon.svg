<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Woods Island — Obsidian Companion, refined</title>
  <desc id="desc">An original smooth obsidian companion with twin rounded crests, ivory eyes and a pearl ceramic tile.</desc>
  <defs>
